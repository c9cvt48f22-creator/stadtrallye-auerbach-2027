<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stadtrallye Bürgerfest 2027 – Auerbach</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0;">

    <div id="app" style="max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <!-- App lädt -->
    </div>

    <script>
        /* =========================================================================
         * 🗄️ ZENTRALE DATENBANK & TEXTVERWALTUNG
         * Hier kannst du alle Texte, Aufgaben, Hinweise und Lösungen anpassen!
         * ========================================================================= */
        const GAME_DATABASE = {
            settings: {
                pointsLostPerHint: 2, // Punkteabzug pro genutztem Hinweis
                defaultPoints: 10
            },
            stations: [
                {
                    id: "station-01",
                    name: "Station 1 – Rathaus & Wappen",
                    type: "PUZZLE_AND_TRIPLE_INPUT",
                    description: "Betrachtet das Auerbacher Stadtwappen. Setzt es im Kopf aus 12 Teilen zusammen und benennt anschließend die drei historischen Berge, auf denen der Auerochse steht!",
                    // Offizieller, direkter Link zum Wappen (wird sofort zuverlässig angezeigt)
                    imageUrl: "https://upload.wikimedia.org/wikipedia/commons/4/4e/Wappen_von_Auerbach_in_der_Oberpfalz.png",
                    solutions: ["grünberg", "gottvaterberg", "pinzigberg"],
                    hints: [
                        "Hinweis 1: Die Namen der drei Berge beginnen mit den Buchstaben G, G und P.",
                        "Hinweis 2: Schaut euch das Wappen genau an – die drei Kuppeln unten im Schild bilden diese Berge ab."
                    ],
                    points: 15
                },
                {
                    id: "station-02",
                    name: "Station 2 – Bergleute",
                    type: "SINGLE_INPUT",
                    description: "Die Grubenlampe flackert! Löst das Rätsel vor Ort und gebt den korrekten Zahlencode ein, um das Licht wieder zu aktivieren.",
                    solution: "1488",
                    hints: [
                        "Hinweis 1: Sucht nach einer historischen Jahreszahl im Bereich des Bergbaus.",
                        "Hinweis 2: Es ist das Jahr, in dem wichtige Bergrechte verliehen wurden."
                    ],
                    points: 10
                },
                {
                    id: "station-03",
                    name: "Station 3 – Jahreszahlen",
                    type: "SINGLE_INPUT",
                    description: "Bringt die historischen Ereignisse aus Auerbachs Geschichte in die exakte chronologische Reihenfolge (ältestes Datum zuerst).",
                    solution: "1144",
                    hints: [
                        "Hinweis 1: Schaut euch die Jahreszahlen der alten Stadtrechte an.",
                        "Hinweis 2: Die Jahreszahl liegt im 12. Jahrhundert."
                    ],
                    points: 10
                },
                {
                    id: "station-04",
                    name: "Station 4 – Goldener Löwe",
                    type: "SINGLE_INPUT",
                    description: "Wer saß an welchem Tisch im alten Hotel? Löst das 4×4-Gästebuch-Logikrätsel. Welcher Gast saß auf Platz 1? (Gib den Beruf ein).",
                    solution: "bergmann",
                    hints: [
                        "Hinweis 1: Der gesuchte Gast arbeitet unter Tage.",
                        "Hinweis 2: Er hat auf jeden Fall keinen Karren gelenkt."
                    ],
                    points: 15
                },
                {
                    id: "station-05",
                    name: "Station 5 – Heinrich Stromer",
                    type: "SINGLE_INPUT",
                    description: "Dr. Heinrich Stromer (Dr. Auerbach) begründete den berühmten Keller. Welcher Ort bzw. Stadt ist der Schlüssel zu seinem Erfolg?",
                    solution: "leipzig",
                    hints: [
                        "Hinweis 1: Es ist eine berühmte Universitätsstadt in Sachsen.",
                        "Hinweis 2: Dort steht auch der weltbekannte 'Auerbachs Keller'."
                    ],
                    points: 10
                },
                {
                    id: "station-06",
                    name: "Station 6 – Auerochse",
                    type: "SINGLE_INPUT",
                    description: "Unser stolzes Wappentier! Löst die Aufgabe rund um den Auerochsen von Auerbach.",
                    solution: "auerochse",
                    hints: [
                        "Hinweis 1: Es ist ein ausgestorbenes, wildes Rind.",
                        "Hinweis 2: Das Wort steckt bereits im Namen unseres Suchspiels."
                    ],
                    points: 10
                },
                {
                    id: "station-07",
                    name: "Station 7 – Bücherei",
                    type: "SINGLE_INPUT",
                    description: "Buchstabensalat! Welches der gesuchten Groß-Wörter zum Thema Auerbach stand ganz oben im Rätsel?",
                    solution: "auerochse",
                    hints: [
                        "Hinweis 1: Es ist genau dasselbe mächtige Tier wie aus Station 6.",
                        "Hinweis 2: Es beginnt mit dem Buchstaben A."
                    ],
                    points: 10
                },
                {
                    id: "station-08",
                    name: "Station 8 – Kirche & Eisenerzaltar",
                    type: "SINGLE_INPUT",
                    description: "Cäsar-Geheimschrift! Welcher weltberühmte Ort in Amerika teilt sich mit Auerbach den einzigen Eisenerzaltar der Welt?",
                    solution: "newyork",
                    hints: [
                        "Hinweis 1: Die Stadt schläft nie und liegt an der US-Ostküste.",
                        "Hinweis 2: Das gesuchte Wort besteht aus zwei englischen Begriffen zusammengeschrieben."
                    ],
                    points: 15
                },
                {
                    id: "station-09",
                    name: "Station 9 – Goldener Brunnen",
                    type: "SINGLE_INPUT",
                    description: "Morse-Code am Brunnen bei Eis und Co.! Entschlüsselt das dort versteckte Lösungswort.",
                    solution: "brunnen",
                    hints: [
                        "Hinweis 1: Es sprudelt aus Stein und steht direkt vor eurer Nase.",
                        "Hinweis 2: Es passt perfekt zum Namen 'Goldener ...'."
                    ],
                    points: 15
                },
                {
                    id: "station-10",
                    name: "Station 10 – Finale",
                    type: "SINGLE_INPUT",
                    description: "Das große Finale! Wer muss damals wie heute beim Bürgerfest 2027 zusammenhelfen, damit alles gelingt? (Ein kurzes Wort).",
                    solution: "alle",
                    hints: [
                        "Hinweis 1: Niemand schafft es als Einzelkämpfer.",
                        "Hinweis 2: Das Wort bedeutet: wirklich ausnahmslos jede Gruppe und Person."
                    ],
                    points: 0
                }
            ],
            routes: [
                ["station-01", "station-03", "station-02", "station-05", "station-04", "station-07", "station-06", "station-09", "station-08", "station-10"],
                ["station-02", "station-04", "station-01", "station-06", "station-03", "station-08", "station-07", "station-01", "station-05", "station-10"],
                ["station-03", "station-01", "station-05", "station-04", "station-02", "station-06", "station-09", "station-08", "station-07", "station-10"]
            ]
        };

        /* =========================================================================
         * ⚙️ SPIEL-LOGIK (Hier musst du nichts ändern)
         * ========================================================================= */
        class RallyApp {
            constructor() {
                this.loadState();
            }

            loadState() {
                const saved = localStorage.getItem('rallye_team_state');
                if (saved) {
                    this.state = JSON.parse(saved);
                } else {
                    this.state = {
                        teamName: null,
                        memberNames: [],
                        routeStations: [],
                        currentStationIndex: 0,
                        points: 0,
                        status: "NOT_STARTED",
                        notes: "",
                        isPaused: false,
                        hintsUsedForCurrentStation: 0,
                        puzzleSolved: false
                    };
                }
            }

            saveState() {
                localStorage.setItem('rallye_team_state', JSON.stringify(this.state));
            }

            registerTeam(teamName, memberNamesString) {
                if (!teamName || teamName.trim() === "") return false;
                const members = memberNamesString ? memberNamesString.split(',').map(n => n.trim()).filter(n => n.length > 0) : [];
                const randomRoute = GAME_DATABASE.routes[Math.floor(Math.random() * GAME_DATABASE.routes.length)];

                this.state.teamName = teamName.trim();
                this.state.memberNames = members;
                this.state.routeStations = randomRoute;
                this.state.currentStationIndex = 0;
                this.state.status = "ACTIVE";
                this.state.points = 0;
                this.state.hintsUsedForCurrentStation = 0;
                this.state.puzzleSolved = false;
                this.saveState();
                return true;
            }

            getCurrentStation() {
                if (this.state.isPaused) return null;
                if (this.state.currentStationIndex >= this.state.routeStations.length) return null;
                const sId = this.state.routeStations[this.state.currentStationIndex];
                return GAME_DATABASE.stations.find(s => s.id === sId);
            }

            useHint() {
                const current = this.getCurrentStation();
                if (!current) return;
                if (this.state.hintsUsedForCurrentStation < current.hints.length) {
                    this.state.hintsUsedForCurrentStation++;
                    this.state.points = Math.max(0, this.state.points - GAME_DATABASE.settings.pointsLostPerHint);
                    this.saveState();
                }
            }

            skipStation() {
                this.state.currentStationIndex++;
                this.state.hintsUsedForCurrentStation = 0;
                this.state.puzzleSolved = false;
                this.saveState();
            }

            checkAnswer(answers) {
                const current = this.getCurrentStation();
                if (!current) return false;

                if (current.type === "PUZZLE_AND_TRIPLE_INPUT") {
                    const match0 = answers[0].toLowerCase().trim() === current.solutions[0];
                    const match1 = answers[1].toLowerCase().trim() === current.solutions[1];
                    const match2 = answers[2].toLowerCase().trim() === current.solutions[2];

                    if (match0 && match1 && match2) {
                        this.state.points += current.points;
                        this.state.currentStationIndex++;
                        this.state.hintsUsedForCurrentStation = 0;
                        this.state.puzzleSolved = false;
                        this.saveState();
                        return true;
                    }
                    return false;
                } else {
                    const cleanInput = answers[0].toLowerCase().trim();
                    if (cleanInput === current.solution.toLowerCase()) {
                        this.state.points += current.points;
                        this.state.currentStationIndex++;
                        this.state.hintsUsedForCurrentStation = 0;
                        this.saveState();
                        return true;
                    }
                    return false;
                }
            }

            pause() { this.state.isPaused = true; this.saveState(); }
            resume() { this.state.isPaused = false; this.saveState(); }
            saveNotes(text) { this.state.notes = text; this.saveState(); }
            resetGame() { localStorage.removeItem('rallye_team_state'); location.reload(); }
        }

        const app = new RallyApp();
        const container = document.getElementById('app');

        function render() {
            if (app.state.isPaused) {
                container.innerHTML = `
                    <div style="padding: 40px; text-align: center; background: #fff3cd;">
                        <h2>⏸️ PAUSE AKTIV</h2>
                        <p>Das Spiel ist pausiert. Die Zeit steht still und Aufgaben sind gesperrt.</p>
                        <button id="resume-btn" style="background: #2a9d8f; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px;">Pause beenden</button>
                    </div>
                `;
                document.getElementById('resume-btn').onclick = () => { app.resume(); render(); };
                return;
            }

            if (app.state.status === "NOT_STARTED") {
                container.innerHTML = `
                    <div style="padding: 30px;">
                        <h2 style="color: #1b4332; margin-top: 0;">Stadtrallye Bürgerfest 2027</h2>
                        <p style="color: #6c757d; margin-bottom: 25px;">Auerbach in der Oberpfalz</p>
                        
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 8px;">Wie heißt euer Team?</label>
                            <input type="text" id="team-input" placeholder="z. B. Die Stadtfüchse" style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; box-sizing: border-box;">
                        </div>

                        <div style="margin-bottom: 25px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 8px;">Vornamen der Teammitglieder (durch Komma getrennt):</label>
                            <input type="text" id="members-input" placeholder="z. B. Anna, Lukas, Ben" style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; box-sizing: border-box;">
                        </div>

                        <button id="start-btn" style="width: 100%; background: #1b4332; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;">Rallye starten 🚀</button>
                    </div>
                `;
                document.getElementById('start-btn').onclick = () => {
                    const tName = document.getElementById('team-input').value;
                    const mNames = document.getElementById('members-input').value;
                    if (app.registerTeam(tName, mNames)) { render(); } else { alert("Bitte Teamnamen eingeben!"); }
                };
            } else {
                const current = app.getCurrentStation();
                
                if (!current) {
                    const membersList = app.state.memberNames.length > 0 ? app.state.memberNames.join(', ') : 'Keine Mitglieder angegeben';
                    container.innerHTML = `
                        <div style="padding: 30px; text-align: center;">
                            <h2 style="color: #1b4332;">🎉 Herzlichen Glückwunsch, ${app.state.teamName}!</h2>
                            <p style="color: #6c757d; font-size: 16px;">Ihr habt alle Stationen gemeistert und die Botschaft der Vergangenheit entschlüsselt!</p>
                            
                            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: left; border: 1px solid #dee2e6;">
                                <p><strong>Teamname:</strong> ${app.state.teamName}</p>
                                <p><strong>Mitglieder (für die Siegerehrung):</strong> ${membersList}</p>
                                <p><strong>Erzielte Punkte:</strong> ${app.state.points}</p>
                            </div>

                            <p style="font-size: 14px; color: #495057; font-style: italic;">„Nichts geht alleine – alle müssen zusammenhelfen, damals wie heute beim Bürgerfest 2027!“</p>
                            
                            <button id="restart-btn" style="background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 20px;">Neustart / Zurück</button>
                        </div>
                    `;
                    document.getElementById('restart-btn').onclick = () => { app.resetGame(); };
                    return;
                }

                let hintsHtml = "";
                if (app.state.hintsUsedForCurrentStation > 0) {
                    hintsHtml += `<div style="background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 6px; margin-bottom: 15px;">`;
                    for (let i = 0; i < app.state.hintsUsedForCurrentStation; i++) {
                        hintsHtml += `<p style="margin: 4px 0; color: #856404; font-size: 14px;">💡 <strong>${current.hints[i]}</strong></p>`;
                    }
                    hintsHtml += `</div>`;
                }

                // Bild anzeigen, falls imageUrl in der Station definiert ist
                let imageHtml = "";
                if (current.imageUrl) {
                    imageHtml = `
                        <div style="text-align: center; margin: 15px 0;">
                            <img src="${current.imageUrl}" alt="Wappen" style="max-width: 140px; height: auto; border: 1px solid #dee2e6; border-radius: 8px; padding: 5px; background: white;">
                        </div>
                    `;
                }

                let taskBodyHtml = "";
                if (current.type === "PUZZLE_AND_TRIPLE_INPUT" && !app.state.puzzleSolved) {
                    taskBodyHtml = `
                        <div style="background: #e2f0cb; padding: 20px; border-radius: 8px; border: 1px solid #b5d56c; text-align: center; margin-bottom: 20px;">
                            <h4 style="margin-top: 0; color: #386641;">🧩 12-Teile Stadtwappen-Puzzle</h4>
                            <p style="font-size: 14px; color: #3a5a40;">Setzt die 12 Puzzleteile im Kopf zusammen. Wenn das Wappen komplett ist, klickt hier:</p>
                            <button id="solve-puzzle-btn" style="background: #386641; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Puzzle gelöst! Weiter zu den Bergen ✅</button>
                        </div>
                    `;
                } else if (current.type === "PUZZLE_AND_TRIPLE_INPUT" && app.state.puzzleSolved) {
                    taskBodyHtml = `
                        <div style="margin-bottom: 15px;">
                            <p style="font-weight: bold; color: #386641; margin-bottom: 8px;">Benennt die 3 historischen Berge auf dem Wappen:</p>
                            <input type="text" id="ans-0" placeholder="1. Berg" style="width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box;">
                            <input type="text" id="ans-1" placeholder="2. Berg" style="width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box;">
                            <input type="text" id="ans-2" placeholder="3. Berg" style="width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">
                            <button id="submit-answer" style="background: #2a9d8f; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px;">Antworten prüfen ✅</button>
                        </div>
                    `;
                } else {
                    taskBodyHtml = `
                        <div style="margin-bottom: 15px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #1b4332;">Eure Lösung eingeben:</label>
                            <input type="text" id="ans-0" placeholder="Lösungswort oder Code..." style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 12px;">
                            <button id="submit-answer" style="background: #2a9d8f; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px;">Lösung prüfen ✅</button>
                        </div>
                    `;
                }

                let hintButtonHtml = "";
                if (app.state.hintsUsedForCurrentStation < current.hints.length) {
                    hintButtonHtml = `<button id="hint-btn" style="background: #e9c46a; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">💡 Hinweis (-${GAME_DATABASE.settings.pointsLostPerHint} Pkt)</button>`;
                }

                container.innerHTML = `
                    <div style="padding: 15px 20px; background: #1b4332; color: white; display: flex; justify-content: space-between; align-items: center;">
                        <div><strong>Team:</strong> ${app.state.teamName}</div>
                        <div><strong>Punkte:</strong> ${app.state.points}</div>
                    </div>
                    
                    <div style="padding: 25px;">
                        <span style="background: #e9ecef; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #495057;">AKTUELLE AUFGABE</span>
                        <h3 style="margin-top: 10px; font-size: 20px; color: #2d6a4f;">${current.name}</h3>
                        <p style="color: #495057; line-height: 1.5; font-size: 16px;">${current.description}</p>
                        
                        ${imageHtml}
                        ${hintsHtml}

                        <div style="margin-top: 25px; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #dee2e6;">
                            ${taskBodyHtml}
                            <p id="error-msg" style="color: #e63946; font-size: 14px; margin-top: 10px; display: none;"></p>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                            ${hintButtonHtml}
                            <button id="skip-btn" style="background: #e76f51; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;">⏭️ Station überspringen (0 Pkt)</button>
                        </div>
                    </div>

                    <div style="padding: 15px 20px; background: #f1f3f5; display: flex; gap: 10px; justify-content: space-around; margin-top: 20px;">
                        <button id="pause-btn" style="background: #ffb703; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">⏸️ Pause</button>
                        <button id="notes-btn" style="background: #6c757d; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">📝 Notizen</button>
                    </div>
                `;

                const solvePuzzleBtn = document.getElementById('solve-puzzle-btn');
                if (solvePuzzleBtn) {
                    solvePuzzleBtn.onclick = () => {
                        app.state.puzzleSolved = true;
                        app.saveState();
                        render();
                    };
                }

                const hBtn = document.getElementById('hint-btn');
                if (hBtn) {
                    hBtn.onclick = () => { app.useHint(); render(); };
                }

                document.getElementById('skip-btn').onclick = () => {
                    if (confirm("Wollt ihr diese Station wirklich überspringen? Ihr erhaltet dafür keine Punkte.")) {
                        app.skipStation();
                        render();
                    }
                };

                document.getElementById('pause-btn').onclick = () => { app.pause(); render(); };
                
                document.getElementById('notes-btn').onclick = () => {
                    container.innerHTML = `
                        <div style="padding: 25px;">
                            <h3>Team-Notizen</h3>
                            <textarea id="notes-ta" style="width: 100%; height: 180px; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 16px;">${app.state.notes || ""}</textarea>
                            <div style="display: flex; gap: 12px;">
                                <button id="save-n" style="flex: 1; background: #2a9d8f; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">Speichern</button>
                                <button id="cancel-n" style="flex: 1; background: #e63946; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">Abbrechen</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('save-n').onclick = () => { app.saveNotes(document.getElementById('notes-ta').value); render(); };
                    document.getElementById('cancel-n').onclick = () => { render(); };
                };

                const submitBtn = document.getElementById('submit-answer');
                if (submitBtn) {
                    submitBtn.onclick = () => {
                        let answers = [];
                        if (current.type === "PUZZLE_AND_TRIPLE_INPUT") {
                            answers = [
                                document.getElementById('ans-0').value,
                                document.getElementById('ans-1').value,
                                document.getElementById('ans-2').value
                            ];
                        } else {
                            answers = [document.getElementById('ans-0').value];
                        }

                        const success = app.checkAnswer(answers);
                        if (success) {
                            render();
                        } else {
                            const err = document.getElementById('error-msg');
                            err.style.display = 'block';
                            err.textContent = "Leider nicht ganz richtig! Nutzt bei Bedarf einen Hinweis.";
                        }
                    };
                }
            }
        }

        render();
    </script>
</body>
</html>
